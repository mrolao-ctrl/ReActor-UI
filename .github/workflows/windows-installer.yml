name: Windows installer (existing Python environment)

on:
  pull_request:
    paths:
      - 'installer/**'
      - 'modules/**'
      - 'run.py'
      - '.github/workflows/windows-installer.yml'
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'modules/**'
      - 'run.py'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout our source
        uses: actions/checkout@v4

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler not available: $compiler"
          }

      - name: Generate the Windows ICO from the branded PNG
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python -c "from PIL import Image; i=Image.open('assets/reactor-studio.png').convert('RGBA').resize((256,256),Image.Resampling.LANCZOS); i.save('assets/reactor-studio.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(96,96),(128,128),(256,256)])"
          if (-not (Test-Path 'assets/reactor-studio.ico')) {
            throw "Branded Windows icon was not generated"
          }

      - name: Build lightweight Windows setup
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer\ReActor-Studio.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with code $LASTEXITCODE"
          }
          if (-not (Test-Path 'dist\ReActor-Studio-Setup.exe')) {
            throw "Installer executable was not generated"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReActor-Studio-Windows-Installer
          path: dist/ReActor-Studio-Setup.exe
          if-no-files-found: error
          retention-days: 30
