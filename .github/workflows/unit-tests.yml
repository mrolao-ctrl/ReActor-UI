name: Unit tests (no AI models)
on:
  push:
    branches: [feature/select-target-person]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" "opencv-python-headless<5" pillow
      - name: Validate Python syntax
        run: python -m compileall -q modules tests
      - name: Run unit tests without private media or model files
        run: python -m unittest discover -s tests -v
